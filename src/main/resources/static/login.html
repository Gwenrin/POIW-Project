<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="mobile-menu.js" defer></script>
    <title>POIW-Project</title>
</head>
<body>
    <header class="navbar">
        <div class="navbar__container">
            <a href="index.html" class="navbar__main">OCR</a>
            <nav class="navbar__nav" id="main-nav" aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="history.html" class="nav-link">Previous files</a></li>
                    <li><a href="about.html" class="nav-link">About the project</a></li>
                    <li><a href="license.html" class="nav-link">License</a></li>
                    <li><a href="login.html" class="nav-link">Log in</a></li>
                </ul>
            </nav>
            <button class="navbar__mobile-toggle" id="mobile-toggle" type="button" aria-label="Open Menu" aria-controls="mobile-menu-pane" aria-expanded="false">
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" /></svg>
            </button>
        </div>
    </header>

    <nav class="mobile-menu-pane" id="mobile-menu-pane" aria-label="Mobile navigation" aria-hidden="true"></nav>

    <main class="page-main page-main--centered">
        <section class="auth-card">
            <h1>Login form</h1>
            <form class="auth-form" action="" method="post">
                <div class="form-field">
                    <label for="first">Username:</label>
                    <input type="text" id="first" name="first" autocomplete="username" required>
                </div>
                <div class="form-field">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <div class="form-actions form-actions--single">
                    <button class="form-button form-button--primary" type="submit">Log in</button>
                </div>
            </form>
            <p class="auth-switch">
                <a href="signup.html">Create an account</a>
            </p>
        </section>
    </main>
</body>
</html>
